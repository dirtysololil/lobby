<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Lobby</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-app: #000000;
        --bg-panel: #0a0a0a;
        --bg-hover: rgba(255, 255, 255, 0.05);
        --border: rgba(255, 255, 255, 0.1);
        --border-strong: rgba(255, 255, 255, 0.18);
        --text: #f5f5f5;
        --text-dim: #a3a3a3;
        --text-muted: #737373;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: 32px;
        background: var(--bg-app);
        color: var(--text);
        font:
          14px/1.55 Inter,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--bg-panel);
        padding: 24px;
      }

      .kicker {
        margin: 0 0 10px;
        color: var(--text-muted);
        font:
          11px/1.3 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0;
      }

      p {
        margin: 12px 0 0;
        color: var(--text-dim);
      }

      code {
        display: block;
        margin-top: 16px;
        overflow-wrap: anywhere;
        color: var(--text-muted);
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }

      button {
        margin-top: 20px;
        min-height: 40px;
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        background: #fafafa;
        color: #000000;
        padding: 0 14px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #ffffff;
      }

      button:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.2);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Lobby Desktop</p>
      <h1>Не удалось подключиться к серверу</h1>
      <p>
        Проверьте интернет-соединение или адрес сервера, затем повторите
        подключение.
      </p>
      <code id="details"></code>
      <button id="reload" type="button">Повторить</button>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const details = document.querySelector("#details");
      const reload = document.querySelector("#reload");

      details.textContent = `${params.get("url") || ""}\n${params.get("description") || ""}`;
      reload.addEventListener("click", () => window.LobbyDesktop.reload());
    </script>
  </body>
</html>
